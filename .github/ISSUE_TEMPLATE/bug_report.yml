name: Bug report
description: Report a reproducible Canvas PDF Composer problem
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem without including private course content or credentials.
    validations:
      required: true
  - type: input
    id: item-type
    attributes:
      label: Canvas item or resource type
      placeholder: File / PDF / PPTX / Google Slides / External URL / Page
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
