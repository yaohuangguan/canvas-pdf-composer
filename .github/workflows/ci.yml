name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Package extension
        run: cd dist && zip -r ../canvas-pdf-composer.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-pdf-composer
          path: canvas-pdf-composer.zip
